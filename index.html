<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Basic Calculator</title>
  <meta name="description" content="A fast, responsive, and elegant basic calculator with history and keyboard support.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="calculator-app-container">
    <!-- Main Calculator Card -->
    <main class="calculator-card" role="region" aria-label="Calculator">
      <!-- Top Control Bar -->
      <header class="calc-header">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-title">CalcPro</span>
        </div>
        <div class="calc-controls">
          <button id="theme-toggle" class="icon-btn" aria-label="Toggle light or dark theme" title="Toggle Theme">
            <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button id="history-toggle" class="icon-btn" aria-label="Toggle calculation history" title="Calculation History">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </button>
        </div>
      </header>

      <!-- Calculator Display -->
      <section class="display-panel" aria-live="polite">
        <div class="expression-line" id="expression-display" title="Current Expression"></div>
        <div class="result-row">
          <span class="operator-badge" id="pending-op"></span>
          <div class="main-display" id="main-display" tabindex="0" title="Click or tap to copy result">0</div>
        </div>
        <button id="copy-btn" class="copy-pill" aria-label="Copy current value" title="Copy to clipboard">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span class="copy-text">Copy</span>
        </button>
      </section>

      <!-- Keypad -->
      <section class="keypad" role="group" aria-label="Calculator keypad">
        <!-- Row 1: Clear & Parentheses -->
        <button type="button" class="key key-func" data-action="clear" aria-label="All Clear" id="key-clear">AC</button>
        <button type="button" class="key key-func" data-action="backspace" aria-label="Backspace / Delete" id="key-backspace">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button type="button" class="key key-func" data-action="parentheses" aria-label="Parentheses ( )" id="key-parentheses">( )</button>
        <button type="button" class="key key-op" data-operator="/" aria-label="Divide" id="key-divide">÷</button>

        <!-- Row 2: 7, 8, 9, Multiply -->
        <button type="button" class="key key-num" data-number="7">7</button>
        <button type="button" class="key key-num" data-number="8">8</button>
        <button type="button" class="key key-num" data-number="9">9</button>
        <button type="button" class="key key-op" data-operator="*" aria-label="Multiply" id="key-multiply">×</button>

        <!-- Row 3: 4, 5, 6, Subtract -->
        <button type="button" class="key key-num" data-number="4">4</button>
        <button type="button" class="key key-num" data-number="5">5</button>
        <button type="button" class="key key-num" data-number="6">6</button>
        <button type="button" class="key key-op" data-operator="-" aria-label="Subtract" id="key-subtract">−</button>

        <!-- Row 4: 1, 2, 3, Add -->
        <button type="button" class="key key-num" data-number="1">1</button>
        <button type="button" class="key key-num" data-number="2">2</button>
        <button type="button" class="key key-num" data-number="3">3</button>
        <button type="button" class="key key-op" data-operator="+" aria-label="Add" id="key-add">+</button>

        <!-- Row 5: Negate, 0, Decimal, Equals -->
        <button type="button" class="key key-func" data-action="negate" aria-label="Toggle Positive or Negative">±</button>
        <button type="button" class="key key-num" data-number="0">0</button>
        <button type="button" class="key key-num" data-action="decimal" aria-label="Decimal point">.</button>
        <button type="button" class="key key-equals" data-action="calculate" aria-label="Calculate equals" id="key-equals">=</button>
      </section>

      <!-- Keyboard shortcuts hint -->
      <footer class="calc-footer">
        <span>Press <kbd>Esc</kbd> to clear, <kbd>Enter</kbd> to calculate</span>
      </footer>
    </main>

    <!-- Slide-in History Drawer / Side Panel -->
    <aside class="history-drawer" id="history-drawer" aria-label="History panel" aria-hidden="true">
      <div class="history-header">
        <div class="history-title">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <h3>History</h3>
        </div>
        <div class="history-actions">
          <button id="clear-history-btn" class="text-btn" title="Clear all history">Clear</button>
          <button id="close-history-btn" class="icon-btn" aria-label="Close history" title="Close">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="history-list" id="history-list">
        <!-- Rendered items go here -->
        <div class="empty-history-msg">No recent calculations</div>
      </div>
    </aside>

    <!-- Overlay backdrop for mobile / modal drawer -->
    <div class="drawer-backdrop" id="drawer-backdrop"></div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
